<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>삶의 동행 | SIONLIGHT</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#24354e,#0b1422 75%);color:#f5f0e7;font:16px/1.7 system-ui,'Malgun Gothic',sans-serif}main{max-width:850px;margin:auto;padding:35px 20px}header{text-align:center}h1{font-size:clamp(26px,5vw,40px)}h2{color:#e6c58c;font-size:21px}a{color:#e6c58c}.card{background:#132237;border:1px solid #35445a;border-radius:15px;padding:22px;margin-top:22px}label{display:block;margin:16px 0 5px}input,textarea,select{display:block;width:100%;border:1px solid #506078;border-radius:8px;background:#091725;color:white;font:inherit;padding:10px}textarea{min-height:125px}button{margin-top:18px;background:#e6c58c;border:0;border-radius:8px;padding:11px 20px;color:#162238;font-weight:bold;cursor:pointer}.note{font-size:14px;color:#bac7d8}.preview{white-space:pre-wrap;overflow-wrap:anywhere}footer{text-align:center;color:#b9c4d0;margin:35px}</style></head><body><main><header><div style="letter-spacing:.3em;color:#e6c58c">SIONLIGHT</div><h1>삶의 동행</h1><p>서로의 삶을 소개하고 따뜻한 인연을 만들어 가는 공간</p><a href="./chat1.html">← 세 공간으로 돌아가기</a></header>
<section class="card"><h2>나를 소개합니다</h2><p>자기소개 글을 작성하고 미리 볼 수 있어요. 다른 방문자에게 공개하는 게시판은 현재 준비 중이에요.</p>
<form id="introForm"><label for="nickname">닉네임</label><input id="nickname" maxlength="24" required placeholder="실명 대신 닉네임을 사용해 주세요"><label for="interest">관심사</label><select id="interest"><option>일상과 대화</option><option>신앙과 성경</option><option>취미와 여가</option><option>인생 경험 나누기</option></select><label for="intro">자기소개</label><textarea id="intro" maxlength="600" required placeholder="좋아하는 일, 나누고 싶은 이야기, 어떤 동행을 원하는지 적어 주세요."></textarea><p class="note">실명, 전화번호, 주소, 계좌번호 등 개인정보는 작성하지 마세요. 현재 글은 서버에 저장하거나 공개하지 않습니다.</p><button type="submit">소개 글 미리 보기</button></form></section>
<section class="card" id="previewCard" hidden><h2>내 소개 글 미리 보기</h2><div id="preview" class="preview"></div><p class="note">미리 보기만 가능하며 게시되지 않았습니다. 공개 게시판은 저장·관리·신고 기능을 마련한 후 열 예정입니다.</p></section>
<footer>빛과 위로가 머무는 공간, SIONLIGHT.</footer></main><script>document.getElementById('introForm').addEventListener('submit',e=>{e.preventDefault();const v=id=>document.getElementById(id).value;document.getElementById('preview').textContent=v('nickname')+'\n관심사: '+v('interest')+'\n\n'+v('intro');document.getElementById('previewCard').hidden=false;document.getElementById('previewCard').scrollIntoView({behavior:'smooth'});});</script></body></html>
