
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>말씀 너머 | SIONLIGHT</title>
<style>
  body {
    margin: 0;
    padding: 35px 18px;
    background: #101b2c;
    color: #f6e9d2;
    font-family: Arial, sans-serif;
    text-align: center;
  }
  a { color: #e8c17e; }
  h1 { font-size: 36px; margin-bottom: 12px; }
  h2 { font-size: 22px; line-height: 1.5; }
  p { line-height: 1.8; }
  .container { max-width: 900px; margin: auto; }
  .video-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
    text-align: left;
    margin-top: 28px;
  }
  @media (max-width: 640px) {
    .video-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  }
  .video-card h2 { font-size: clamp(15px, 2.6vw, 20px); margin: 10px 0 0; }
  .video-card p { font-size: 14px; margin: 6px 0 0; }
  .video {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    box-sizing: border-box;
    border: 1px solid #b99760;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
  }
  .video button { padding: 0; cursor: pointer; position: relative; background: #161616; }
  .video button, .video img, iframe { display: block; width: 100%; height: 100%; border: 0; }
  .video img { object-fit: cover; }
  .video button:focus-visible { outline: 3px solid #fff; outline-offset: -4px; }
  .play-icon {
    position: absolute;
    inset: 50% auto auto 50%;
    transform: translate(-50%, -50%);
    padding: 7px 14px;
    border-radius: 8px;
    background: #000c;
    color: white;
  }
  .footer { margin-top: 45px; color: #c8bca9; }
</style>
</head>
<body>
<div class="container">
  <a href="sanctuary.html">← 성전으로 돌아가기</a>

  <h1>말씀 너머</h1>
  <p>빛과 위로가 머무는 공간, SIONLIGHT.</p>
  <p>모든 설교는 무료로 시청하실 수 있습니다.</p>

  <section class="video-grid" aria-label="설교 목록">
    <article class="video-card">
      <div class="video">
        <button type="button" data-video-id="VlggK4Dcbu0" aria-label="제1편 · 하나님은 왜 나를 외면하십니까? 재생">
          <img src="https://i.ytimg.com/vi/VlggK4Dcbu0/hqdefault.jpg" alt="">
          <span class="play-icon" aria-hidden="true">▶</span>
        </button>
      </div>
      <h2>제1편 · 하나님은 왜 나를 외면하십니까?</h2>
      <p>고통 속에서 하나님을 향한 질문을 함께 나누고, 말씀을 통해 위로와 희망을 찾는 시간입니다.</p>
    </article>
  </section>

  <div class="footer">
    SIONLIGHT 가상교회<br>
    빛과 위로가 머무는 공간
  </div>
</div>
<script>
  document.querySelector('.video-grid').addEventListener('click', (event) => {
    const button = event.target.closest('button[data-video-id]');
    if (!button) return;

    const player = document.createElement('iframe');
    player.src = 'https://www.youtube-nocookie.com/embed/' + button.dataset.videoId + '?autoplay=1';
    player.title = button.closest('.video-card').querySelector('h2').textContent;
    player.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
    player.referrerPolicy = 'strict-origin-when-cross-origin';
    player.allowFullscreen = true;
    button.replaceWith(player);
    player.focus();
  });
</script>
</body>
</html>
