
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>말씀 너머 | ZIONLIGHT</title>
<style>
  body {
    margin: 0;
    padding: 35px 18px;
    background: #101b2c;
    color: #f6e9d2;
    font-family: Arial, sans-serif;
    text-align: center;
  }
  a { color: #e8c17e; }
  h1 { font-size: 36px; margin-bottom: 12px; }
  h2 { font-size: 22px; line-height: 1.5; }
  p { line-height: 1.8; }
  .container { max-width: 900px; margin: auto; }
  .video-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 20px;
    text-align: left;
    margin-top: 28px;
  }
  @media (max-width: 700px) {
    .video-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  }
  .video-card h2 { font-size: clamp(15px, 2.6vw, 20px); margin: 10px 0 0; }
  .video-card p { font-size: 14px; margin: 6px 0 0; }
  .video {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    box-sizing: border-box;
    border: 1px solid #b99760;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
  }
  .video button { padding: 0; cursor: pointer; position: relative; background: #161616; }
  .video button, .video img, iframe { display: block; width: 100%; height: 100%; border: 0; }
  .video img { object-fit: cover; }
  .video button:focus-visible { outline: 3px solid #fff; outline-offset: -4px; }
  .play-icon {
    position: absolute;
    inset: 50% auto auto 50%;
    transform: translate(-50%, -50%);
    padding: 7px 14px;
    border-radius: 8px;
    background: #000c;
    color: white;
  }
  @media (max-width: 700px) {
    .video-card h2 { font-size: 14px; }
    .video-card p { font-size: 12px; }
    .play-icon { padding: 4px 9px; }
  }
  [hidden] { display: none !important; }
  .video-grid.shorts .video { aspect-ratio: 9 / 16; }
  .footer { margin-top: 45px; color: #c8bca9; }
</style>
</head>
<body>
<div class="container">
  <a href="sanctuary.html">← 성전으로 돌아가기</a>

  <h1>말씀 너머</h1>
  <p>빛과 위로가 머무는 공간, ZIONLIGHT.</p>

  <section id="shorts-section" hidden aria-label="영상 목록">
    <div class="video-grid shorts" id="shorts-grid"></div>
  </section>

  <div class="footer">
    ZIONLIGHT 가상교회<br>
    빛과 위로가 머무는 공간
  </div>
</div>
<script>
  document.querySelector('.container').addEventListener('click', (event) => {
    const button = event.target.closest('button[data-video-id]');
    if (!button) return;

    const player = document.createElement('iframe');
    player.src = 'https://www.youtube-nocookie.com/embed/' + button.dataset.videoId + '?autoplay=1';
    player.title = button.closest('.video-card').querySelector('h2').textContent;
    player.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
    player.referrerPolicy = 'strict-origin-when-cross-origin';
    player.allowFullscreen = true;
    button.replaceWith(player);
    player.focus();
  });

  const videoIdPattern = /^[A-Za-z0-9_-]{11}$/;

  async function readShorts() {
    const response = await fetch('sermon-shorts.json', { cache: 'no-store' });
    if (!response.ok) throw new Error('목록을 불러오지 못했습니다.');
    const list = await response.json();
    if (!Array.isArray(list) || !list.every((item) =>
      item && typeof item.title === 'string' && videoIdPattern.test(item.id)
    )) throw new Error('쇼츠 목록의 형식을 확인해 주세요.');
    return list;
  }

  function renderShort({ id, title }) {
    const card = document.createElement('article');
    card.className = 'video-card';
    card.innerHTML = '<div class="video"><button type="button"><img alt="" loading="lazy"><span class="play-icon" aria-hidden="true">▶</span></button></div><h2></h2>';
    const button = card.querySelector('button');
    button.dataset.videoId = id;
    button.setAttribute('aria-label', title + ' 재생');
    card.querySelector('img').src = 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg';
    card.querySelector('h2').textContent = title;
    if (id === 'FIpWSWXgauM') {
      card.insertAdjacentHTML('beforeend', '<p><a href="https://billygraham.org/minutes/billy-graham-anxiety-relief" target="_blank" rel="noopener" style="color:inherit">빌리 그레이엄 전도협회 공식 원문 보기</a></p>');
    }
    if (id === 'FtC164PpFg8') {
      card.insertAdjacentHTML('beforeend', '<p><a href="https://billygraham.org/sermons/the-prodigal-son" target="_blank" rel="noopener" style="color:inherit">빌리 그레이엄 전도협회 공식 원설교 듣기</a></p>');
    }
    if (id === 'FXii4UP6e2k') {
      card.insertAdjacentHTML('beforeend', '<p><a href="https://billygraham.org/answers/whats-wrong-with-my-marriage" target="_blank" rel="noopener" style="color:inherit">빌리 그레이엄 전도협회 공식 원문 보기</a></p>');
    }
    if (id === 'doAnvzYyBp8') {
      card.insertAdjacentHTML('beforeend', '<p><a href="https://billygraham.org/answers/how-can-i-learn-to-control-my-tongue-and-avoid-causing-hurt-with-my-words-especially-with-family" target="_blank" rel="noopener" style="color:inherit">빌리 그레이엄 전도협회 공식 원문 보기</a></p>');
    }
    if (id === 'D4pb428t37c') {
      card.insertAdjacentHTML('beforeend', '<p><a href="https://billygraham.org/answers/elderly-mother-needs-your-prayers-and-practical-help" target="_blank" rel="noopener" style="color:inherit">빌리 그레이엄 전도협회 공식 원문 보기</a></p>');
    }
    return card;
  }

  const shortsGrid = document.querySelector('#shorts-grid');
  const shortsSection = document.querySelector('#shorts-section');
  const savedVideos = fetch('https://sionlight-chat.hongkh827.workers.dev/sermon-videos.json')
    .then((response) => {
      if (!response.ok) throw new Error('등록 영상 목록을 불러오지 못했습니다.');
      return response.json();
    })
    .catch((error) => { console.error(error); return []; });

  readShorts().catch((error) => { console.error(error); return []; }).then(async (list) => {
    shortsGrid.replaceChildren(...list.map(renderShort));
    shortsSection.hidden = list.length === 0;
    const saved = await savedVideos;
    if (!Array.isArray(saved)) return;
    const ids = new Set(list.map(({ id }) => id));
    const newVideos = saved.filter((item) =>
      item && typeof item.id === 'string' && videoIdPattern.test(item.id) &&
      typeof item.title === 'string' && !ids.has(item.id)
    );
    shortsGrid.prepend(...newVideos.map(renderShort));
    shortsSection.hidden = shortsGrid.childElementCount === 0;
  });
</script>
</body>
</html>
