<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시온라이트 이야기 | SIONLIGHT</title>
<style>
[hidden]{display:none!important}html{color-scheme:dark}body{margin:0;background:#101927;color:#edf1f6;font:1rem/1.7 system-ui,sans-serif}main{max-width:42rem;margin:auto;padding:2rem 1.25rem}a,h1,h2{color:#f3d49b}section{background:#162437;border:1px solid #9b8056;border-radius:1rem;padding:1.25rem;margin-top:1rem}h2{margin-top:0}section p:last-child{margin-bottom:0}
main > section{-webkit-user-select:none;user-select:none}
</style>
</head>
<body><main>
<a href="sanctuary.html">← 성전으로 돌아가기</a>
<h1>시온라이트 이야기</h1>
<article id="story-01">
  <h2>01. 시온라이트를 연 이유</h2>
  <p>빛과 위로가 머무는 공간, SIONLIGHT.</p>
  <iframe src="https://www.youtube-nocookie.com/embed/KnUD6MEbftM" title="시온라이트 이야기 01" style="display:block;width:100%;max-width:360px;aspect-ratio:9/16;margin:auto;border:0" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  <p><a href="https://youtube.com/shorts/KnUD6MEbftM">유튜브에서 보기</a></p>
</article>
<!-- 교리를 추가할 때 아래 section 한 묶음을 복사해 제목과 본문을 입력하세요.
빈 문단을 채운 뒤 section의 hidden을 지우면 방문자에게 보입니다.
장을 추가할 때 장 제목의 id와 section의 aria-labelledby를 같은 새 값으로 바꾸세요.
-->
<section aria-labelledby="chapter-1" hidden>
  <h2 id="chapter-1">제1장 제목</h2>
  <p>여기에 교리 본문을 입력하세요.</p>
</section>
<p id="empty-state">소개 글을 준비 중입니다.</p>
<script>
  document.getElementById('empty-state').hidden =
    Boolean(document.querySelector('#story-01, main > section:not([hidden])'));
  document.querySelectorAll('main > section').forEach(section => {
    section.addEventListener('copy', event => event.preventDefault());
    section.addEventListener('contextmenu', event => event.preventDefault());
  });
</script>
</main></body>
</html>
